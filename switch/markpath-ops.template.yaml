version: 1
params:
  team:
    type: string
    label: Team prefix
    description: Prefix used for every Markpath agent and the operations room.
    default: markpath
    pattern: "[a-z][a-z0-9-]*"
  provider:
    type: provider
    label: Agent provider
    description: The coding-agent runtime for the Markpath agents.
    default: [codex, claude, opencode]
    input: advanced
  location:
    type: location
    description: The machine where agents run.
    default: local
    input: advanced
  directory:
    type: directory
    description: The base directory for local Markpath agents.
    default: "{$agents_dir}/{agent}"
    input: advanced
  bridge:
    type: bridge
    label: Messaging app
    description: The messaging app that hosts the Markpath operations room.
    default: [$first]
    input: advanced
agents:
  - name: "{team}-director"
    description: Coordinates approved Markpath brand operations.
    provider: "{provider}"
    location: "{location}"
    directory: "{directory}"
    addressing: anyone
    instructions: |
      You are the Brand Director. Use the Markpath agent API for facts and record only verified results. Delegate audits with real @mentions. Never claim completion without QA evidence.
  - name: "{team}-design"
    description: Inspects supported Figma resources and reports evidence.
    provider: "{provider}"
    location: "{location}"
    directory: "{directory}"
    addressing: owner-agents
    instructions: |
      You are the Design Agent. Inspect only assigned Figma resources. Request a resource-bound approval before edits. Report unsupported operations clearly.
  - name: "{team}-implementation"
    description: Inspects repositories and prepares focused branch and PR changes.
    provider: "{provider}"
    location: "{location}"
    directory: "{directory}"
    addressing: owner-agents
    instructions: |
      You are the Implementation Agent. Never edit a default branch or merge. Use the Markpath API approval binding before any execution and report branch, commit, and evidence.
  - name: "{team}-qa"
    description: Independently verifies brand operations.
    provider: "{provider}"
    location: "{location}"
    directory: "{directory}"
    addressing: owner-agents
    instructions: |
      You are Brand QA. Re-read resources independently. Do not accept API success or another agent's claim as proof. Return specific verification evidence.
room:
  name: "{team}-ops"
  description: Shared operations room for Markpath brand audits, approvals, execution, and independent QA.
  channel_type: channel_private
  bridge: "{bridge}"
  agents: ["{team}-director", "{team}-design", "{team}-implementation", "{team}-qa"]
  users: ["{$creator}"]
  instructions: |
    This room coordinates Markpath's Detect, Coordinate, Correct, and Verify workflow. Consequential changes require a resource-bound approval and QA verification.
kickoff: |
  @{team}-director Create a Nexa fixture audit plan. Delegate Figma to @{team}-design and code to @{team}-implementation. Request explicit resource approvals, then ask @{team}-qa to independently verify every executed operation.
