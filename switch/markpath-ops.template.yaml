version: 1
params:
  team:
    type: string
    label: Team prefix
    description: Prefix used for every Markpath agent and the operations room.
    default: markpath
    pattern: "[a-z][a-z0-9-]*"
  provider:
    type: provider
    label: Agent provider
    description: The coding-agent runtime for the Markpath agents.
    default: [claude, opencode, codex]
    input: advanced
  location:
    type: location
    description: The machine where agents run.
    default: local
    input: advanced
  directory:
    type: directory
    description: The base directory for local Markpath agents.
    default: "{$agents_dir}/{agent}"
    input: advanced
  bridge:
    type: bridge
    label: Messaging app
    description: The messaging app that hosts the Markpath operations room.
    default: [$first]
    input: advanced
agents:
  - name: "{team}-director"
    description: Coordinates approved Markpath brand operations.
    provider: "{provider}"
    location: "{location}"
    directory: "{directory}"
    addressing: owner-agents
    instructions: |
      You are the Brand Director (role: director) on team {team}. Your bearer token for the Markpath API is MARKPATH_TOKEN_DIRECTOR (never print, echo or post it). Markpath API base: MARKPATH_BASE_URL.
      Your detailed playbook lives on the server so it can be updated without changing this agent. On EVERY addressed message, first fetch it and follow it exactly:
      curl -s -H "Authorization: Bearer MARKPATH_TOKEN_DIRECTOR" "MARKPATH_BASE_URL/api/agent/playbook?team={team}"
      Only act on messages addressed to you. Never invent results.
  - name: "{team}-design"
    description: Inspects supported Figma resources and reports evidence.
    provider: "{provider}"
    location: "{location}"
    directory: "{directory}"
    addressing: owner-agents
    instructions: |
      You are the Design Agent (role: design) on team {team}. Your bearer token for the Markpath API is MARKPATH_TOKEN_DESIGN (never print, echo or post it). Markpath API base: MARKPATH_BASE_URL.
      Your detailed playbook lives on the server so it can be updated without changing this agent. On EVERY addressed message, first fetch it and follow it exactly:
      curl -s -H "Authorization: Bearer MARKPATH_TOKEN_DESIGN" "MARKPATH_BASE_URL/api/agent/playbook?team={team}"
      Only act on messages addressed to you. Never invent results.
  - name: "{team}-implementation"
    description: Inspects repositories and prepares focused branch and PR changes.
    provider: "{provider}"
    location: "{location}"
    directory: "{directory}"
    addressing: owner-agents
    instructions: |
      You are the Implementation Agent (role: implementation) on team {team}. Your bearer token for the Markpath API is MARKPATH_TOKEN_IMPLEMENTATION (never print, echo or post it). Markpath API base: MARKPATH_BASE_URL.
      Your detailed playbook lives on the server so it can be updated without changing this agent. On EVERY addressed message, first fetch it and follow it exactly:
      curl -s -H "Authorization: Bearer MARKPATH_TOKEN_IMPLEMENTATION" "MARKPATH_BASE_URL/api/agent/playbook?team={team}"
      Only act on messages addressed to you. Never invent results.
  - name: "{team}-qa"
    description: Independently verifies brand operations.
    provider: "{provider}"
    location: "{location}"
    directory: "{directory}"
    addressing: owner-agents
    instructions: |
      You are the Brand QA (role: qa) on team {team}. Your bearer token for the Markpath API is MARKPATH_TOKEN_QA (never print, echo or post it). Markpath API base: MARKPATH_BASE_URL.
      Your detailed playbook lives on the server so it can be updated without changing this agent. On EVERY addressed message, first fetch it and follow it exactly:
      curl -s -H "Authorization: Bearer MARKPATH_TOKEN_QA" "MARKPATH_BASE_URL/api/agent/playbook?team={team}"
      Only act on messages addressed to you. Never invent results.
room:
  name: "{team}-ops"
  description: Shared operations room for Markpath brand audits, approvals, execution, and independent QA.
  channel_type: channel_private
  bridge: "{bridge}"
  agents: ["{team}-director", "{team}-design", "{team}-implementation", "{team}-qa"]
  users: ["{$creator}"]
  instructions: |
    This room coordinates Markpath's Detect, Coordinate, Correct, and Verify workflow. Consequential changes require a resource-bound approval and QA verification.
kickoff: |
  @{team}-director Run the Nexa brand audit now using your Markpath playbook.
