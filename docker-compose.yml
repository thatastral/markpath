services:
  markpath:
    build: .
    ports:
      - "${MARKPATH_BIND_ADDR:-127.0.0.1}:3000:3000"
    environment:
      MARKPATH_SESSION_SECRET: ${MARKPATH_SESSION_SECRET:?set MARKPATH_SESSION_SECRET in .env}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      SWITCH_BASE_URL: ${SWITCH_BASE_URL:-}
      MARKPATH_PUBLIC_URL: ${MARKPATH_PUBLIC_URL:-}
      MARKPATH_PR_WATCH: ${MARKPATH_PR_WATCH:-on}
      MARKPATH_DB_PATH: /app/data/markpath.sqlite
    volumes:
      - markpath-data:/app/data
    restart: unless-stopped
volumes:
  markpath-data:
